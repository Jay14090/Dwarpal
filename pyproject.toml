[project]
name = "dwarpal"
version = "0.1.0"
description = "AI security operator for gated communities: multi-camera person/vehicle intelligence"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.20.0",
    "fast-plate-ocr>=1.1.0",
    "fastapi>=0.142.2",
    "gdown>=6.4.1",
    "huggingface-hub>=2.1.1",
    "insightface>=2.1",
    "lap>=0.5.13",
    "numpy>=2.4.6",
    "onnxruntime>=1.30.0",
    "open-image-models>=0.6.0",
    "opencv-python>=5.0.0.93",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "sqlalchemy>=2",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "ultralytics>=8.4.173",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "scripts"]
extend-exclude = ["backend/app/vendor", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401", "E501"]  # formatter owns line length

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"
markers = [
  "db: needs a reachable PostgreSQL with pgvector (skipped otherwise)",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
