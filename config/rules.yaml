# Alert rules (backend/app/rules.py). A rule fires once per incident (a person's continuous
# presence in a zone) and at most once per person (global ID) or plate per cooldown_s.
# type: unknown_in_zone | unregistered_vehicle | loitering | after_hours | tailgating
# zones: zone names from cameras.yaml; empty list = the camera's restricted zones.
# params.roles: identity states the rule applies to (pending people never trigger rules).

defaults:
  cooldown_s: 300
  presence_gap_s: 10   # unseen in a zone for this long = left it (next entry is a new incident)

rules:
  - id: unknown_in_restricted_zone
    type: unknown_in_zone
    enabled: true
    severity: high
    zones: []

  - id: unregistered_vehicle_at_gate
    type: unregistered_vehicle
    enabled: true
    severity: medium

  - id: loitering_unknown
    type: loitering
    enabled: true
    severity: medium
    zones: []
    params:
      min_dwell_s: 60

  - id: after_hours_entry
    type: after_hours
    enabled: true
    severity: high
    zones: []
    params:
      start: "22:00"
      end: "06:00"

  - id: tailgating
    type: tailgating
    enabled: false
    severity: medium
    zones: []
    params:
      window_s: 3
