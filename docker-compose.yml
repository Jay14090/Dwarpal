# Local infra for Dwarpal. Works with Docker Desktop (WSL2 backend) and native Linux Docker.
# Values come from .env (copied from .env.example by `make setup`).
name: dwarpal

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dwarpal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dwarpal}
      POSTGRES_DB: ${POSTGRES_DB:-dwarpal}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  mediamtx:
    image: bluenviron/mediamtx:1.21.1
    restart: unless-stopped
    volumes:
      - ./config/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "${RTSP_PORT:-8554}:8554"   # RTSP (TCP only, see config/mediamtx.yml)
      - "${HLS_PORT:-8888}:8888"    # HLS, handy for a quick browser check
      - "${MEDIAMTX_API_PORT:-9997}:9997"  # control API (list active paths)

volumes:
  pgdata:
